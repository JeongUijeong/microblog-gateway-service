server:
  port: 8080

spring:
  application:
    name: gateway-service

  config:
    import: optional:configserver:http://config-server:8888

  cloud:
    config:
      name: gateway-service

    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/